name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2; pin by immutable commit and update through Dependabot.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v5.6.0; pin by immutable commit and update through Dependabot.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example policy
        run: evm-privacy-ci validate-policy examples/basic/evm-privacy-ci.json
      - name: Explain rule metadata
        run: evm-privacy-ci explain VC003
