name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2; pin by immutable commit and update through Dependabot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5.6.0; pin by immutable commit and update through Dependabot.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example policy
        run: evm-privacy-ci validate-policy examples/basic/evm-privacy-ci.json
      - name: Explain rule metadata
        run: evm-privacy-ci explain VC003
