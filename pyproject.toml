[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veilcheck"
version = "0.0.0"
description = "Proposal-stage privacy-boundary CI tooling for Vela, zkVerify, and Solidity applications."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "VeilCheck contributors"}]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
veilcheck = "veilcheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
